# MySQL 데이터베이스 설정

# 로컬에서 실행 중인 MySQL Docker 컨테이너에 접속
# Docker에서 3306 포트를 호스트의 3306 포트로 연결했기 때문에
# localhost:3306으로 접근
spring.datasource.url=jdbc:mysql://localhost:3306/baseball_ticket

# MySQL 사용자 계정
spring.datasource.username=root

# docker-compose.yml의 MYSQL_ROOT_PASSWORD와 동일해야 함
spring.datasource.password=12345678


# JPA(Hibernate) 설정

# 엔티티 변경사항을 데이터베이스에 자동 반영
# 개발 단계에서는 update 사용
# 운영 환경에서는 validate 또는 none 권장
spring.jpa.hibernate.ddl-auto=update

# 실행되는 SQL을 콘솔에 출력
spring.jpa.show-sql=true

# SQL을 보기 좋게 정렬해서 출력
spring.jpa.properties.hibernate.format_sql=true


# Spring Boot 서버 설정

# Spring Boot 서버 포트
server.port=8080


# JWT 설정

# JWT 토큰 생성에 사용할 비밀키
jwt.secret=BaseballTicketingProjectSecretKeyBaseballTicketingProjectSecretKey123456789

# JWT 만료 시간 (1시간 = 3,600,000ms)
jwt.expiration=3600000


# Redis 설정

# 로컬에서 실행 중인 Redis Docker 컨테이너에 접속
# Docker에서 6379 포트를 호스트의 6379 포트로 연결했기 때문에
# localhost:6379로 접근
spring.data.redis.host=localhost

# Redis 기본 포트
spring.data.redis.port=6379

# Toss Payments
toss.payments.client-key=${TOSS_CLIENT_KEY}
toss.payments.secret-key=${TOSS_SECRET_KEY}