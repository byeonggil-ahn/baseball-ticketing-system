# MySQL 데이터베이스 설정


# Docker Compose에서 생성한 MySQL 컨테이너의 서비스 이름(mysql)으로 접속
# localhost가 아니라 mysql을 사용하는 이유는
# Spring Boot와 MySQL이 같은 Docker 네트워크 안에서 통신하기 때문이다.
spring.datasource.url=jdbc:mysql://mysql:3306/baseball_ticket

# MySQL 사용자 계정
spring.datasource.username=root

# docker-compose.yml의 MYSQL_ROOT_PASSWORD와 반드시 동일해야 한다.
spring.datasource.password=12345678


# JPA(Hibernate) 설정


# 엔티티 변경사항을 데이터베이스에 자동 반영
# 개발 단계에서는 update를 사용
# 운영 환경에서는 validate 또는 none 사용
spring.jpa.hibernate.ddl-auto=update

# 실행되는 SQL을 콘솔에 출력
spring.jpa.show-sql=true

# SQL을 보기 좋게 정렬해서 출력
spring.jpa.properties.hibernate.format_sql=true



# Spring Boot 서버 설정

# Spring Boot 서버 포트
server.port=8081


# JWT 설정

# JWT 토큰 생성에 사용할 비밀키
jwt.secret=BaseballTicketingProjectSecretKeyBaseballTicketingProjectSecretKey123456789

# JWT 만료 시간 (1시간 = 3,600,000ms)
jwt.expiration=3600000