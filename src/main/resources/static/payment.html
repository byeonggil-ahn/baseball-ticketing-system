<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>야구 티켓 결제</title>

    <!-- 토스 결제 SDK -->
    <script src="https://js.tosspayments.com/v2/standard"></script>
</head>

<body>

<h2>야구 티켓 결제</h2>

<p>결제 금액: 10,000원</p>

<div id="payment-method"></div>

<div id="agreement"></div>

<button id="payment-button">결제하기</button>

<script>

    // URL에서 예약 ID 가져오기
    const params =
        new URLSearchParams(window.location.search);

    const reservationId =
        params.get("reservationId");

    // 예약 ID 확인
    if (!reservationId) {

        alert("예약 정보가 없습니다.");

        throw new Error("reservationId가 없습니다.");
    }

    // 토스 클라이언트 키
    const clientKey =
        'test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm';

    // 토스 SDK 초기화
    const tossPayments =
        TossPayments(clientKey);

    // 결제 위젯 초기화
    const widgets =
        tossPayments.widgets({
            customerKey: TossPayments.ANONYMOUS
        });

    // 결제 금액 설정
    widgets.setAmount({
        currency: 'KRW',
        value: 10000
    });

    // 결제수단 표시
    widgets.renderPaymentMethods({
        selector: '#payment-method',
        variantKey: 'DEFAULT'
    });

    // 약관 표시
    widgets.renderAgreement({
        selector: '#agreement',
        variantKey: 'AGREEMENT'
    });

    // 결제하기
    document.getElementById('payment-button')
        .addEventListener('click', async () => {

            try {

                await widgets.requestPayment({

                    // 예약 ID가 포함된 주문 ID
                    orderId:
                        'baseball-' +
                        reservationId +
                        '-' +
                        Date.now(),

                    // 주문 이름
                    orderName:
                        '야구 티켓 1매',

                    // 결제 성공
                    successUrl:
                        window.location.origin +
                        '/payment-success.html?reservationId=' +
                        reservationId,

                    // 결제 실패
                    failUrl:
                        window.location.origin +
                        '/payment-fail.html?reservationId=' +
                        reservationId
                });

            } catch (error) {

                console.error(error);

                alert(error.message);
            }
        });

</script>

</body>
</html>
